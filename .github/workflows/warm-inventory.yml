# Precalcula cada noche Análisis Inventario (valor, KPIs, compras CHINA TRF) y Controlling · Compras por artículo/proveedor para que la página cargue al momento:
# CRAZE los últimos 12 meses y el resto de empresas el mes en curso y el anterior. Los meses cerrados se guardan una
# semana en caché (y el mes en curso un día), así que las llamadas de meses ya calculados vuelven al momento.
name: Precalcular Análisis Inventario

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Precalcular
        env:
          APP_URL: ${{ vars.APP_URL || 'https://craze-finance-iota.vercel.app' }}
          INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
        run: |
          fail=0
          warm() {
            company="$1"; month="$2"
            for path in "reporting/inventory?month=$month" "reporting/purchases?month=$month" \
                        "reporting/inventory-analysis?month=$month" "reporting/inventory-analysis?kind=kpis&month=$month" \
                        "reporting/inventory-analysis?kind=purchases&month=$month"; do
              code=$(curl -s -o out.json -w '%{http_code}' -m 300 -H "Authorization: Bearer $INTERNAL_API_TOKEN" \
                -H "x-craze-company: $(printf %s "$company" | jq -sRr @uri)" "$APP_URL/api/$path" || echo 000)
              echo "$company · $path → $code"
              if [ "$code" != "200" ]; then head -c 300 out.json; echo; fail=1; fi
            done
          }
          for i in $(seq 0 11); do warm "CRAZE" "$(date -u -d "$(date -u +%Y-%m-01) -$i month" +%Y-%m)"; done
          # Controlling · Compras por artículo / proveedor: año en curso hasta hoy (lo que abre la página por defecto)
          code=$(curl -s -o out.json -w '%{http_code}' -m 300 -H "Authorization: Bearer $INTERNAL_API_TOKEN" -H "x-craze-company: CRAZE" \
            "$APP_URL/api/controlling/purchase-items?company=CRAZE&from=$(date -u +%Y)-01-01&to=$(date -u +%Y-%m-%d)" || echo 000)
          echo "CRAZE · controlling/purchase-items → $code"
          if [ "$code" != "200" ]; then head -c 300 out.json; echo; fail=1; fi
          for company in "Craze Iberia SL" "Craze UK" "CRAZE Group AG" "Craze Entertainment"; do
            for i in 0 1; do warm "$company" "$(date -u -d "$(date -u +%Y-%m-01) -$i month" +%Y-%m)"; done
          done
          exit $fail
